# Builds the generic app shell once. html2apk.py later swaps the HTML, name and icon inside it.
name: Build shell APK
on:
  push:
    paths: ['shell/**', '.github/workflows/build-shell.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - run: cd shell && gradle assembleDebug --no-daemon --stacktrace
      - run: cp shell/app/build/outputs/apk/debug/app-debug.apk shell.apk && ls -la shell.apk
      - uses: actions/upload-artifact@v4
        with: { name: shell-apk, path: shell.apk }
      - name: Commit shell.apk next to html2apk.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shell.apk
          git commit -m "Update shell.apk" || echo "no change"
          git push
      - name: Publish as release "shell-latest"
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete shell-latest --yes --cleanup-tag || true
          gh release create shell-latest shell.apk --title "App shell" --notes "Generic HTML app shell used by html2apk."
